[project]
name = "motar"
version = "0.1.0"
description = "Unified TiTok-L32 1D + MoT/LlamaGen VQ-16 2D autoregressive training"
requires-python = ">=3.10"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py310"
exclude = ["third_party"]

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"motar/model.py" = ["E402"]
"scripts/*.py" = ["E402"]
"train.py" = ["E402"]
"train_disjoint.py" = ["E402"]
